name: Secret Demo
on:
  workflow_dispatch:

jobs:
  check-secret:
  run-on: ubuntu-latest
  steps:
    - name: Lire le secret
      env:
        DEMO_TOKEN: ${{ secrets.DEMO_TOKEN }}
      run: |
        if [ -z "$DEMO_TOKEN" ]; then
          echo "Le Token est vide"
          exit 1
        fi
        echo "Longueur du Token: ${#DEMO_TOKEN}"
        echo "Tentative d'affichage du Token : $DEMO_TOKEN"
        echo "Environnement : ${{ vars.APP_ENV }}"
