name: Secret Demo
on:
  workflow_dispatch:

jobs:
  check-secret:
    runs-on: ubuntu-latest
    steps:
      - name: Vérifier et utiliser le secret et la variable
        env:
          DEMO_TOKEN: ${{ secrets.DEMO_TOKEN }}
        run: |
          if [ -z "$DEMO_TOKEN" ]; then
            echo "Erreur : le secret DEMO_TOKEN est vide !"
            exit 1
          fi
          echo "Longueur du secret : ${#DEMO_TOKEN}"
          echo "Tentative d'affichage du secret : $DEMO_TOKEN"
          echo "Environnement (variable APP_ENV) : ${{ vars.APP_ENV }}"
